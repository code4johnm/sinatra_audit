# SINTRA live interceptor only. The bus listener is Deployment yaml-listen
# from /mnt/5TB/git/bus-listener. It is not a container in this pod.
# Application files are this checkout, mounted read-only at /opt/sinatra.
# Replicas stay 0 until scaled. See DEPLOY.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sinatra
  namespace: default
  labels:
    app: sinatra
spec:
  replicas: 0
  selector:
    matchLabels:
      app: sinatra
  template:
    metadata:
      labels:
        app: sinatra
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sinatra
          image: sinatra-sandbox:local
          imagePullPolicy: Never
          command:
            - python
            - /opt/sinatra/launch.py
            - /opt/sinatra/sintra_live_sky_catalog_interceptor.py
          workingDir: /output
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: MPLBACKEND
              value: Agg
            - name: MPLCONFIGDIR
              value: /tmp/mpl
            - name: HOME
              value: /tmp
            - name: PYTHONUNBUFFERED
              value: "1"
            # The source mount is read-only. Do not try to write bytecode beside the scripts.
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: SINTRA_HUD_PORT
              value: "8080"
          ports:
            - name: hud
              containerPort: 8080
              hostPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: hud
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: source
              mountPath: /opt/sinatra
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: output
              mountPath: /output
            - name: wan-ip
              mountPath: /var/lib/wan-ip
              readOnly: true
      volumes:
        - name: source
          hostPath:
            path: /mnt/5TB/git/sinatra_audit
            type: Directory
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: output
          emptyDir:
            sizeLimit: 1Gi
        - name: wan-ip
          hostPath:
            path: /home/user/sinatra-sandbox/wan-ip
            type: DirectoryOrCreate
