apiVersion: v1
kind: Service
metadata:
  name: sinatra
  labels:
    app: sinatra
  annotations:
    sinatra/note: >-
      Web HUD for the live interceptor. The terminal log and PNG still run.
      The page is published on this laptop at port 8080 by the host network. It is not authenticated.
spec:
  type: ClusterIP
  selector:
    app: sinatra
  ports:
    - name: hud
      port: 8080
      targetPort: hud
      protocol: TCP
